<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Disc Snowman — sobreviva às serras na arena de pedra.">
  <title>Disc Snowman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=leaderboard-v1">
  <script src="./game.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <section class="username-screen" id="username-screen" aria-label="Identificação do jogador">
      <div class="landing-snowman" role="img" aria-label="Boneco de neve"><svg viewBox="0 0 260 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="130" cy="205" r="67" fill="#dff5ff"/><circle cx="130" cy="116" r="48" fill="#eafaff"/><path d="M91 85 L96 47 Q130 29 164 47 L169 85 Z" fill="#152536"/><path d="M91 72 Q130 63 169 72 L169 83 Q130 91 91 83Z" fill="#ffcc22"/><circle cx="115" cy="112" r="4.6" fill="#152536"/><circle cx="145" cy="112" r="4.6" fill="#152536"/><path d="M128 120 L151 127 L128 132Z" fill="#ff9d32"/><path d="M88 154 Q130 171 172 154 L176 172 Q130 190 84 172Z" fill="#ffca1c"/></svg></div>
      <label for="username-input">ESCOLHA SEU NOME</label>
      <input id="username-input" maxlength="16" minlength="2" autocomplete="nickname" placeholder="Seu nome no ranking">
      <p class="username-error" id="username-error" aria-live="polite"></p>
      <button class="landing-start-button" id="username-continue">CONTINUAR</button>
    </section>
    <section class="landing-screen" id="landing-screen" aria-label="Tela inicial">
      <div class="landing-snowman" role="img" aria-label="Boneco de neve com cachecol amarelo"><svg viewBox="0 0 260 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><radialGradient id="snowBody" cx="32%" cy="22%" r="78%"><stop offset="0" stop-color="#fff"/><stop offset=".62" stop-color="#dff5ff"/><stop offset="1" stop-color="#83b8d1"/></radialGradient><linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe66a"/><stop offset="1" stop-color="#ffb900"/></linearGradient></defs><ellipse cx="130" cy="276" rx="82" ry="13" fill="#f5d84c" opacity=".15"/><circle cx="130" cy="205" r="67" fill="url(#snowBody)" stroke="#b9e8f8" stroke-width="2"/><circle cx="130" cy="116" r="48" fill="url(#snowBody)" stroke="#b9e8f8" stroke-width="2"/><path d="M91 85 L96 47 Q130 29 164 47 L169 85 Z" fill="#152536" stroke="#3b5264" stroke-width="2"/><path d="M91 72 Q130 63 169 72 L169 83 Q130 91 91 83Z" fill="#ffcc22"/><circle cx="115" cy="112" r="4.6" fill="#152536"/><circle cx="145" cy="112" r="4.6" fill="#152536"/><path d="M128 120 L151 127 L128 132Z" fill="#ff9d32"/><path d="M118 140 Q130 150 142 140" fill="none" stroke="#41687b" stroke-width="3" stroke-linecap="round"/><path d="M88 154 Q130 171 172 154 L176 172 Q130 190 84 172Z" fill="url(#scarf)"/><path d="M151 167 L171 173 L165 216 L144 211Z" fill="#ffca1c" stroke="#e9ac00" stroke-width="1.5"/><circle cx="130" cy="201" r="4" fill="#527d90"/><circle cx="130" cy="224" r="4" fill="#527d90"/><path d="M72 187 L48 205 M188 187 L211 202" stroke="#8bb8cb" stroke-width="8" stroke-linecap="round"/><path d="M72 188 L49 205 M188 188 L211 202" stroke="#d9f3ff" stroke-width="4" stroke-linecap="round"/><circle cx="98" cy="131" r="6" fill="#f49d9d" opacity=".55"/><circle cx="162" cy="131" r="6" fill="#f49d9d" opacity=".55"/><g fill="#ffdf4d"><path d="M42 85l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/><path d="M206 121l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><path d="M192 44l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></g></svg></div>
      <button class="landing-start-button" id="landing-start-button"><span>COMEÇAR</span></button>
      <div class="landing-record">RECORDE <strong id="landing-best">00:00</strong></div>
    </section>
    <section class="game-screen is-hidden" id="game-screen" aria-label="Arena">
      <header class="minimal-hud">
        <div class="minimal-time" id="timer">00:00<span class="timer-ms">.00</span></div>
        <div class="minimal-meta"><span id="phase-label">FASE 01 / 06</span><span>RECORDE <b id="best-time">00:00</b></span></div>
        <div class="progress-track"><div class="progress-fill" id="time-progress"></div></div>
      </header>
      <section class="arena-frame" aria-label="Arena de pedra">
        <div class="arena-stage">
          <div class="side-control side-control-left">
            <div class="mobile-controls" id="mobile-controls">
              <div class="joystick" id="joystick" aria-label="Controle de movimento"><div class="joystick-ring"></div><div class="joystick-knob" id="joystick-knob"></div></div>
            </div>
          </div>
          <div class="arena-wrap">
            <canvas id="game-canvas" aria-label="Arena quadrada com boneco de neve e serras"></canvas>
            <div class="overlay hidden" id="pause-overlay">
              <div class="overlay-content compact-overlay"><h2>PAUSADO</h2><button class="primary-button" id="resume-button">CONTINUAR</button><button class="text-button" id="restart-pause-button">RECOMEÇAR</button></div>
            </div>
            <div class="overlay hidden" id="gameover-overlay">
              <div class="overlay-content compact-overlay"><h2>FIM DE JOGO</h2><p>Tempo: <strong id="final-time">00:00</strong></p><p>Recorde: <strong id="final-best">00:00</strong></p><p class="score-submit-status" id="score-submit-status" aria-live="polite">Enviando pontuação...</p><button class="primary-button" id="retry-button">TENTAR NOVAMENTE</button></div>
            </div>
          </div>
          <div class="side-control side-control-right"><button class="dash-button" id="dash-button" aria-label="Usar dash"><span>✦</span><b>DASH</b></button></div>
        </div>
      </section>
      <div class="hidden-game-data" aria-hidden="true">
        <span id="threat-label">BAIXO</span><span id="saw-count">00</span><span id="dash-status">PRONTO</span>
        <span id="dash-cooldown">100%</span><span id="arena-state">PROTOCOLO ATIVO</span><span id="fps-counter">60</span>
        <span id="tip-text"></span><span id="final-best-copy"></span>
        <div id="threat-pips"><i></i><i></i><i></i><i></i><i></i></div><div id="threat-fill"></div><div id="dash-fill"></div><div id="record-progress"></div>
        <button id="sound-toggle" aria-label="Som"></button>
      </div>
    </section>
  </main>
</body>
</html>
